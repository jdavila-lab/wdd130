<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Exciting Expedition Rafting</title>
    <meta name="description"
      content="Contact Exciting Expedition Rafting for reservations, questions, trip information, and adventure rafting experiences.">
    <meta name="author" content="Jeffrey Davila">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Exciting Expedition Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-info">
            <h1>Exciting Expedition Rafting Company</h1>
            <p>123 River Adventure Road, Rapids City</p>
            <p>+63 912 345 6789</p>
            <p>info@excitingexpeditionrafting.com</p>
        </section>


        <div class="contact-container">


            <iframe title="Location map of Exciting Expedition Rafting"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019998345239!2d-122.41941568468168!3d37.77492927975942!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ2JzI5LjgiTiAxMjLCsDI1JzA5LjkiVw!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus"
              allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form action="#" method="post">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email address">

                <fieldset style="border:none; padding:0; margin:0;">
                    <legend
                      style="font-size:0.75rem; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--river);">
                        Message Purpose</legend>
                    <div class="radio-group">
                        <label>
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        <label>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label>
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>

                <label class="newsletter-label">
                    <input type="checkbox" name="newsletter" checked id="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </div>


        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employ1.png" alt="Employ1 - River Guide">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employ2.png" alt="Employ2 - Tour Manager">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employ3.png" alt="Employ3 - Safety Instructor">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 💦 Exciting Expedition 💦 Jeffrey Davila</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>

    </footer>

</body>

</html>
